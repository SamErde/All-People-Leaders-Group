# MegaLinter GitHub Action configuration file
# More info at https://megalinter.io
---
name: MegaLinter

# Trigger mega-linter at every push. Action will also be visible from Pull
# Requests to main
on:
  # Comment this line to trigger action only on pull-requests
  # (not recommended if you don't pay for GH Actions)
  push:

  pull_request:
    branches:
      - main
      - master

# Comment env block if you do not want to apply fixes
env:
  # Apply linter fixes configuration
  #
  # When active, APPLY_FIXES must also be defined as environment variable
  # (in github/workflows/mega-linter.yml or other CI tool)
  APPLY_FIXES: all

  # Decide which event triggers application of fixes in a commit or a PR
  # (pull_request, push, all)
  APPLY_FIXES_EVENT: pull_request

  # If APPLY_FIXES is used, defines if the fixes are directly committed (commit)
  # or posted in a PR (pull_request).
  #
  # Only 'commit' is implemented below. Auto-fix commits are pushed with the
  # job's short-lived GITHUB_TOKEN instead of a long-lived PAT. GitHub
  # deliberately does not re-trigger workflows for GITHUB_TOKEN pushes, which
  # removes any risk of a lint/fix/lint loop; the trade-off is that the fix
  # commit itself is not re-linted until the next human push to the branch.
  APPLY_FIXES_MODE: commit

concurrency:
  # Keyed on the pull request number rather than the branch name: fork
  # branches frequently share names (commonly "main"), which would otherwise
  # make unrelated pull requests cancel each other.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Keep the last run on a protected branch alive so its reports are published;
  # feature-branch runs are safe to supersede.
  cancel-in-progress: >-
    ${{ !contains(fromJSON('["main", "master"]'), github.ref_name) }}

permissions:
  contents: read

jobs:
  megalinter:
    name: MegaLinter
    runs-on: ubuntu-latest
    timeout-minutes: 45

    # GITHUB_TOKEN scopes, matched to the endpoints actually used.
    # This job executes every linter, i.e. a large amount of third-party code,
    # over the contents of the pull request. It therefore holds no write access
    # to repository contents at all; pushing auto-fixes is the job of the
    # separate, linter-free 'apply-fixes' job below. 'issues: write' was also
    # removed: this workflow never touches a standalone issue, and MegaLinter's
    # pull request comment reporter is authorised by 'pull-requests: write'.
    permissions:
      contents: read # read the code under review; this job never pushes
      pull-requests: write # MegaLinter's pull request comment reporter

    outputs:
      apply: ${{ steps.gate.outputs.apply }}
      dest_branch: ${{ steps.gate.outputs.dest_branch }}
      linted_sha: ${{ steps.gate.outputs.linted_sha }}

    steps:
      # Git Checkout
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No credentials are written to .git/config, so the linters (and the
          # third-party tools they shell out to) never run alongside a usable
          # push token. Push access is granted later, in a guarded step, only
          # after linting has finished.
          persist-credentials: false

          # Lint exactly the commit the fixes will be applied to. By default a
          # pull_request checkout is the ephemeral merge commit, so fixes would
          # be computed against one tree and committed onto a different one.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

          # If you use VALIDATE_ALL_CODEBASE = true, you can remove this line to
          # improve performance
          fetch-depth: 0

      # MegaLinter
      - name: MegaLinter

        # You can override MegaLinter flavor used to have faster performances
        # More info at https://megalinter.io/flavors/
        uses: oxsecurity/megalinter/flavors/dotnet@7e042c726c68415475b05a65a686c612120a1232 # v7.7.0

        id: ml

        # All available variables are described in documentation
        # https://megalinter.io/configuration/
        env:
          # Validates all source when push on main, else just the git diff with
          # main. Override with true if you always want to lint all sources
          #
          # To validate the entire codebase, set to:
          # VALIDATE_ALL_CODEBASE: true
          #
          # To validate only diff with main, set to:
          # VALIDATE_ALL_CODEBASE: >-
          #   ${{
          #     github.event_name == 'push' &&
          #     contains(fromJSON('["refs/heads/main", "refs/heads/master"]'), github.ref)
          #   }}
          VALIDATE_ALL_CODEBASE: >-
            ${{
              github.event_name == 'push' &&
              contains(fromJSON('["refs/heads/main", "refs/heads/master"]'), github.ref)
            }}

          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          # ADD YOUR CUSTOM ENV VARIABLES HERE OR DEFINE THEM IN A FILE
          # .mega-linter.yml AT THE ROOT OF YOUR REPOSITORY

          # Uncomment to disable copy-paste and spell checks
          # DISABLE: COPYPASTE,SPELL
          # Existing policy: MegaLinter reports findings without failing the
          # build, so the pre-existing backlog in this repository does not block
          # merges. Individual linters are promoted to blocking via
          # <LINTER>_DISABLE_ERRORS: false once their scope is known-clean.
          DISABLE_ERRORS: true
          DISABLE_LINTERS: SPELL_LYCHEE

          # Promoted to blocking: the workflow files in this repository are
          # actionlint-clean, so any new GitHub Actions defect is a regression
          # introduced by the change under review rather than legacy debt.
          ACTION_ACTIONLINT_DISABLE_ERRORS: false

          # Remaining linters stay non-blocking until their backlog is
          # triaged. Tracked separately; see the PR description for scope.
          # DISABLE_ERRORS_LINTERS: REPOSITORY_DEVSKIM,REPOSITORY_KICS,REPOSITORY_CHECKOV,POWERSHELL_POWERSHELL,SPELL_CSPELL

      # Upload MegaLinter artifacts
      - name: Archive production artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: success() || failure()
        with:
          name: MegaLinter reports
          # Most of this repository's lintable files are dot-prefixed, and the
          # fixed copies under updated_sources keep their original paths. The
          # action excludes hidden files by default, which would upload that
          # directory empty and silently strip every fix the apply-fixes job
          # depends on. The uploaded paths below contain only MegaLinter's own
          # output, so nothing sensitive is widened by this.
          include-hidden-files: true
          path: |
            megalinter-reports
            mega-linter.log

      # Decide whether linter fixes should be committed back. Guards, in order:
      # MegaLinter actually changed files; the event matches APPLY_FIXES_EVENT;
      # the head branch belongs to this repository, so a pull request from a
      # fork can never reach the authenticated job below; APPLY_FIXES_MODE is
      # the commit path (MegaLinter's pull_request mode was removed rather than
      # left dormant with a write-scoped token); and the destination branch is
      # neither protected nor oddly named.
      #
      # The decision is published as a job output and consumed by the separate
      # 'apply-fixes' job, which is the only place a write token exists.
      - name: Evaluate write-back eligibility
        id: gate
        if: success() || failure()
        env:
          # Evaluated into environment variables instead of being interpolated
          # into the script, so no expression value is ever parsed as shell code.
          ELIGIBLE: >-
            ${{
              steps.ml.outputs.has_updated_sources == 1 &&
              (
                env.APPLY_FIXES_EVENT == 'all' ||
                env.APPLY_FIXES_EVENT == github.event_name
              ) &&
              (
                github.event_name == 'push' ||
                github.event.pull_request.head.repo.full_name == github.repository
              ) &&
              env.APPLY_FIXES_MODE == 'commit'
            }}
          # The branch the fixes would actually be pushed to. 'github.ref'
          # cannot be used for this test: on pull_request events it is
          # 'refs/pull/<n>/merge', which never matches a protected branch ref,
          # so the protected-branch guard would silently always pass.
          DEST_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
          LINTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          apply="${ELIGIBLE}"

          case "${DEST_BRANCH}" in
            main | master)
              echo "::notice::Refusing to push linter fixes to protected branch '${DEST_BRANCH}'."
              apply=false
              ;;
            '' | *[!A-Za-z0-9._/-]*)
              echo "::notice::Destination branch name is not a plain ref; skipping write-back."
              apply=false
              ;;
          esac

          {
            printf 'apply=%s\n' "${apply}"
            printf 'dest_branch=%s\n' "${DEST_BRANCH}"
            printf 'linted_sha=%s\n' "${LINTED_SHA}"
          } >> "${GITHUB_OUTPUT}"

  # Applying the fixes is deliberately a separate job. No linter, and no other
  # third-party code, runs here: the job only checks out the branch, unpacks the
  # fixed files MegaLinter produced, and commits them. It is consequently the
  # only job in this workflow that holds a write-scoped token, and the untrusted
  # linting phase above cannot reach that token.
  apply-fixes:
    name: Apply linter fixes
    needs: megalinter
    if: needs.megalinter.outputs.apply == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write # push the auto-fix commit to the pull request branch

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      # Checked out by branch name, not by SHA, so HEAD is attached and can be
      # pushed.
      - name: Checkout destination branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.megalinter.outputs.dest_branch }}
          # Credentials are supplied explicitly below rather than written into
          # .git/config, so nothing in this job can read them back out of the
          # checkout.
          persist-credentials: false

      - name: Authenticate push remote
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git remote set-url origin \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

      # The fixes were computed against a specific commit. If the branch has
      # moved since, they no longer describe the code that is there now, so the
      # write-back is abandoned rather than applied to a different tree.
      - name: Verify destination branch has not moved
        id: freshness
        env:
          LINTED_SHA: ${{ needs.megalinter.outputs.linted_sha }}
          DEST_BRANCH: ${{ needs.megalinter.outputs.dest_branch }}
        run: |
          set -euo pipefail
          current_sha="$(git rev-parse HEAD)"
          if [ "${current_sha}" != "${LINTED_SHA}" ]; then
            echo "::notice::'${DEST_BRANCH}' moved from ${LINTED_SHA} to ${current_sha} while linting; skipping write-back."
            printf 'fresh=false\n' >> "${GITHUB_OUTPUT}"
          else
            printf 'fresh=true\n' >> "${GITHUB_OUTPUT}"
          fi

      - name: Download MegaLinter fixed sources
        if: steps.freshness.outputs.fresh == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: MegaLinter reports
          path: ${{ runner.temp }}/megalinter-artifact

      # Unpacked with tar rather than by iterating over paths, so file names
      # containing spaces, quotes or non-ASCII characters are handled byte for
      # byte and never re-parsed by a shell. '.github/workflows' is excluded at
      # this point so no file under it can even reach the working tree: a bot
      # holding a write token must not be able to rewrite the definitions of
      # the jobs that grant it that token.
      - name: Apply fixed sources
        if: steps.freshness.outputs.fresh == 'true'
        env:
          UPDATED_SOURCES: ${{ runner.temp }}/megalinter-artifact/megalinter-reports/updated_sources
        run: |
          set -euo pipefail
          if [ ! -d "${UPDATED_SOURCES}" ]; then
            echo "::notice::No updated sources in the artifact; nothing to apply."
            exit 0
          fi
          tar -C "${UPDATED_SOURCES}" \
            --exclude='./.github/workflows' \
            --exclude='./megalinter-reports' \
            -cf - . \
            | tar -C "${GITHUB_WORKSPACE}" -xf -
          git -C "${GITHUB_WORKSPACE}" status --porcelain

      - name: Commit and push applied linter fixes
        if: steps.freshness.outputs.fresh == 'true'
        uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d # v7.2.0
        with:
          branch: ${{ needs.megalinter.outputs.dest_branch }}
          # Pathspecs, not a glob, hence disable_globbing. These repeat the
          # exclusions already applied when unpacking the artifact, so a change
          # to that step cannot silently widen what gets committed. Excluding
          # .github/workflows is also why no PAT is needed: GitHub rejects
          # GITHUB_TOKEN pushes that touch a workflow file, and nothing else
          # about the write-back requires a broader-scoped credential.
          #
          # Workflow YAML fixes are therefore reported but never auto-applied;
          # a human applies them.
          disable_globbing: true
          file_pattern: ". :!.github/workflows :!megalinter-reports :!mega-linter.log"
          commit_message: "[MegaLinter] Apply linters fixes"
          commit_user_name: megalinter-bot
          # Automated commits are attributed to the bot identity rather than to
          # a maintainer's personal address: a commit produced by a privileged
          # job should be traceable to that job, not look like a human review.
          commit_user_email: megalinter-bot@users.noreply.github.com
